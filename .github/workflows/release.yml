name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish Linux x86-64 release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'

      - name: Build release bundle
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Smoke-check release bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="map-data-fetcher-${GITHUB_REF_NAME}-linux-amd64.tar.gz"
          (cd dist && sha256sum --check "${archive}.sha256")

          smoke_dir="$(mktemp -d)"
          gateway_pid=""
          cleanup() {
            if [[ -n "$gateway_pid" ]]; then
              kill "$gateway_pid" 2>/dev/null || true
              wait "$gateway_pid" 2>/dev/null || true
            fi
            rm -rf -- "$smoke_dir"
          }
          trap cleanup EXIT

          tar -xzf "dist/$archive" -C "$smoke_dir"
          gateway="$smoke_dir/map-data-fetcher-${GITHUB_REF_NAME}-linux-amd64/bin/map-data-gateway"
          [[ "$("$gateway" --version)" == "map-data-gateway ${GITHUB_REF_NAME}" ]]

          GATEWAY_AUTH_MODE=none GATEWAY_PORT=18765 "$gateway" \
            >"$smoke_dir/gateway.log" 2>&1 &
          gateway_pid=$!
          for attempt in $(seq 1 50); do
            if health="$(curl --silent --fail http://127.0.0.1:18765/healthz)"; then
              [[ "$health" == *"\"version\":\"${GITHUB_REF_NAME}\""* ]]
              exit 0
            fi
            sleep 0.2
          done
          cat "$smoke_dir/gateway.log" >&2
          echo 'gateway health smoke check timed out' >&2
          exit 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/map-data-fetcher-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/map-data-fetcher-${{ github.ref_name }}-linux-amd64.tar.gz.sha256
            dist/install.sh
